<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>סיור אחי הקצב</title><style>body{margin:0;background:#020617;color:white;font-family:Arial}.w{max-width:900px;margin:auto;padding:35px 20px}.box{background:white;color:#111827;border-radius:24px;padding:40px;min-height:330px}.bar{height:8px;background:#1e293b;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#dc2626}.btn{background:#b91c1c;color:white;border:0;padding:12px 18px;border-radius:10px;font-weight:bold;margin:8px}.link{color:#fbbf24}</style></head><body><main class="w"><a class="link" href="index.html">← יציאה</a><h2>▶ סיור מכירה לבעל קצבייה</h2><div class="bar"><i id="bar"></i></div><div class="box"><small id="num"></small><h1 id="title"></h1><p id="body"></p><h3>הערך לבעל העסק</h3><p id="win"></p></div><button class="btn" onclick="prev()">הקודם</button><button class="btn" id="play" onclick="toggle()">▶ הפעל אוטומטי</button><button class="btn" onclick="next()">הבא</button></main><script>
const s=[["הלקוח מזמין","קטלוג, משקל משוער, איסוף או משלוח.","פחות חיכוך = יותר הזמנות."],["הקצב שוקל","המשקל בפועל קובע את הסכום.","לא סופגים הפרשי משקל."],["המלאי מתעדכן","יעדים, ספירות ופחת.","פחות חוסרים ופחת."],["רכש","הצעת הזמנה לפי צורך.","קונים בזמן ובכמות נכונה."],["עובדים ומשימות","משמרות ונהלים.","יותר שליטה."],["משלוחים","אזורים וחלונות זמן.","תהליך רציף."],["מועדון","נקודות וקופונים.","לקוחות חוזרים."],["B2B","מפרטים למסעדות ושווארמיות.","מנוע הכנסה נוסף."],["דוחות","רווחיות ומלאי במקום אחד.","החלטות מהירות."],["AI","המלצות וחריגות לאישור מנהל.","פחות ניהול ידני."]];let i=0,t=null;function draw(){num.textContent='שלב '+(i+1)+' מתוך '+s.length;title.textContent=s[i][0];body.textContent=s[i][1];win.textContent=s[i][2];bar.style.width=((i+1)/s.length*100)+'%'}function next(){i=Math.min(s.length-1,i+1);draw()}function prev(){i=Math.max(0,i-1);draw()}function toggle(){if(t){clearInterval(t);t=null;play.textContent='▶ הפעל אוטומטי'}else{play.textContent='⏸ עצור';t=setInterval(()=>{if(i>=s.length-1){clearInterval(t);t=null;play.textContent='▶ הפעל אוטומטי'}else next()},5000)}}draw();
</script></body></html>
