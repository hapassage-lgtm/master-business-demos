<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מעקב הזמנה</title><link rel="stylesheet" href="assets/site.css"><style>:root{--brand:#2563eb;--brand2:#1e3a8a}.status-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.eta{font-size:34px;font-weight:900}.contact-row{display:flex;gap:10px;flex-wrap:wrap}.mini{font-size:12px;color:#64748b}</style></head><body data-brand="tracking">
<nav class="sitebar"><div class="container inner"><b class="brand">מעקב הזמנה • Demo</b><a class="navlink" href="demos.html">כל הדמואים</a></div></nav>
<section class="hero" style="min-height:390px;background-image:url('https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1800&q=85')"><div class="container"><div class="eyebrow">ORDER TRACKING</div><h1>הלקוח יודע איפה ההזמנה — בלי להתקשר.</h1><p>מסך מעקב אחד שמרכז סטטוס, ETA, פרטי הזמנה ועדכונים. כאן הכול עובד מקומית לצורך הדגמה.</p></div></section>
<main class="section"><div class="container"><div class="card"><div class="card-body"><h2>בדיקת הזמנת דמו</h2><p class="lead">הזינו מספר הזמנה שנוצר באחד מאתרי הדמו. אם אין לכם, אפשר להציג הזמנה לדוגמה.</p><div class="actions"><input id="trackInput" class="field" style="max-width:340px" placeholder="למשל SPI-123456"><button class="btn" onclick="goTrack()">בדיקה</button><button class="btn soft" onclick="showSample()">הצג הזמנה לדוגמה</button></div></div></div><section id="result" class="section hide"></section></div></main>
<script src="assets/shop.js"></script><script>
const steps=['הזמנה התקבלה','בהכנה','מוכן לאיסוף / יצא למשלוח','בדרך אליכם','נמסר'];
function brandLabel(b){return {spices:'משה התימני',hardware:'הטמבוריה השכונתית',bakery:'המאפייה השכונתית',flowers:'פרחים בעיר',pet:'החנות של החברים',butcher:'אחי הקצב'}[b]||'העסק'}
function brandHome(b){return {spices:'spices.html',hardware:'hardware.html',bakery:'bakery.html',flowers:'flowers.html',pet:'pet.html',butcher:'index.html'}[b]||'index.html'}
function etaFor(step){return ['45–60 דק׳','30–45 דק׳','15–25 דק׳','8–15 דק׳','נמסר'][Math.min(step,4)]}
function render(o){
 const r=document.getElementById('result');r.classList.remove('hide');
 const items=(o.items||[]).map(x=>'<div class="cart-line"><span>'+x.name+' × '+x.qty+'</span><b>'+money(x.price*x.qty)+'</b></div>').join('');
 r.innerHTML='<div class="grid"><section class="status-card"><span class="badge">'+brandLabel(o.brand)+'</span><h2>הזמנה '+o.id+'</h2><p>'+o.name+'</p><div class="eta">'+etaFor(o.step||1)+'</div><p class="mini">ETA להמחשה בלבד בדמו</p><div class="contact-row"><button class="btn soft" onclick="alert(\'בדמו: פתיחת שיחת WhatsApp ללקוח/עסק\')">WhatsApp</button><button class="btn soft" onclick="alert(\'בדמו: חיוג לעסק/לקוח\')">טלפון</button></div></section><section class="status-card"><h3>סיכום הזמנה</h3>'+items+'<div class="cart-line"><span>משלוח</span><b>'+(o.shipping?money(o.shipping):'חינם')+'</b></div><div class="cart-line"><span><b>סה״כ</b></span><b>'+money(o.total)+'</b></div></section></div><div class="card" style="margin-top:16px"><div class="card-body"><h3>סטטוס</h3><div class="timeline">'+steps.map((s,i)=>'<div class="step '+(i<o.step?'done':i===o.step?'active':'')+'"><small>שלב '+(i+1)+'</small><b>'+s+'</b></div>').join('')+'</div><div class="actions"><button class="btn" onclick="demoTrackNext(\''+o.id+'\')">התקדם שלב בדמו</button><a class="btn soft" href="'+brandHome(o.brand)+'">חזרה לחנות</a></div></div></div>';
}
function goTrack(){const id=document.getElementById('trackInput').value.trim();const o=trackingOrder(id);if(o)render(o);else alert('לא נמצאה הזמנת דמו בדפדפן הזה')}
function showSample(){render({id:'DEMO-8421',name:'לקוח לדוגמה',total:189,shipping:25,step:2,brand:'butcher',items:[{name:'אנטריקוט',qty:1,price:149},{name:'קולה',qty:1,price:15}]})}
const q=new URLSearchParams(location.search),id=q.get('order');if(id){document.getElementById('trackInput').value=id;const o=trackingOrder(id);if(o)render(o)}
</script></body></html>
