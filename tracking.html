<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מעקב הזמנה</title><link rel="stylesheet" href="assets/site.css"></head><body data-brand="tracking"><nav class="sitebar"><div class="container inner"><b class="brand">מעקב הזמנה • Demo</b><a class="navlink" href="index.html">חזרה לדמואים</a></div></nav><main class="section"><div class="container"><div class="card"><div class="card-body"><span class="badge">LIVE DEMO</span><h1>איפה ההזמנה שלי?</h1><p class="lead">הזינו מספר הזמנה שנוצר באחד מאתרי הדמו. אם אין לכם, אפשר לראות הזמנה לדוגמה.</p><div class="actions"><input id="trackInput" class="field" style="max-width:340px" placeholder="למשל SPI-123456"><button class="btn" onclick="goTrack()">בדיקה</button><button class="btn soft" onclick="showSample()">הצג הזמנה לדוגמה</button></div></div></div><section id="result" class="section hide"></section></div></main><script src="assets/shop.js"></script><script>
const steps=['הזמנה התקבלה','בהכנה','מוכן לאיסוף / יצא למשלוח','בדרך אליכם','נמסר'];
function render(o){const r=document.getElementById('result');r.classList.remove('hide');r.innerHTML='<div class="card"><div class="card-body"><div class="owner-strip"><div><b>הזמנה '+o.id+'</b><p>'+o.name+' • '+money(o.total)+'</p></div><span class="badge">דמו אינטראקטיבי</span></div><div class="timeline" style="margin-top:18px">'+steps.map((s,i)=>'<div class="step '+(i<o.step?'done':i===o.step?'active':'')+'"><small>שלב '+(i+1)+'</small><b>'+s+'</b></div>').join('')+'</div><div class="actions"><button class="btn" onclick="demoTrackNext(\''+o.id+'\')">התקדם שלב בדמו</button><a class="btn soft" href="'+brandHome(o.brand)+'">חזרה לחנות</a></div></div></div>'}
function brandHome(b){return {spices:'spices.html',hardware:'hardware.html',bakery:'bakery.html',flowers:'flowers.html',pet:'pet.html',butcher:'index.html'}[b]||'index.html'}
function goTrack(){const id=document.getElementById('trackInput').value.trim();const o=trackingOrder(id);if(o)render(o);else alert('לא נמצאה הזמנת דמו בדפדפן הזה')}
function showSample(){render({id:'DEMO-8421',name:'לקוח לדוגמה',total:189,step:2,brand:'butcher'})}
const q=new URLSearchParams(location.search),id=q.get('order');if(id){document.getElementById('trackInput').value=id;const o=trackingOrder(id);if(o)render(o)}
</script></body></html>
