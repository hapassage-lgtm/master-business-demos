<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מעקב פנייה • מוטי כהן</title><link rel="stylesheet" href="assets/site.css"><style>:root{--brand:#059669;--brand2:#064e3b}</style></head><body><nav class="sitebar"><div class="container inner"><b class="brand">מוטי כהן • משכנתאות</b><a class="navlink" href="mortgage.html">חזרה לאתר</a></div></nav><main class="section"><div class="container"><div class="card"><div class="card-body"><span class="badge">DEMO CRM</span><h1>מעקב פנייה</h1><p class="lead">הזינו את מספר הפנייה שקיבלתם בטופס הדמו.</p><div class="actions"><input id="leadInput" class="field" style="max-width:320px" placeholder="למשל MTG-123456"><button class="btn" onclick="findLead()">בדיקה</button><button class="btn soft" onclick="sample()">פנייה לדוגמה</button></div></div></div><section id="r" class="section hide"></section></div></main><script>
const KEY='mortgage_demo_leads';const steps=['פנייה התקבלה','שיחת היכרות','איסוף נתונים','בדיקת חלופות','פגישה / המשך טיפול'];
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function render(o){const r=document.getElementById('r');r.classList.remove('hide');r.innerHTML='<div class="card"><div class="card-body"><div class="owner-strip"><div><b>פנייה '+o.id+'</b><p>'+o.name+' • '+o.service+'</p></div><span class="badge">דמו תהליך</span></div><div class="timeline" style="margin-top:18px">'+steps.map((s,i)=>'<div class="step '+(i<o.step?'done':i===o.step?'active':'')+'"><small>שלב '+(i+1)+'</small><b>'+s+'</b></div>').join('')+'</div><div class="actions"><button class="btn" onclick="next(\''+o.id+'\')">התקדם שלב בדמו</button></div></div></div>'}
function findLead(){const id=leadInput.value.trim();const o=data().find(x=>x.id===id);o?render(o):alert('לא נמצאה פנייה בדפדפן הזה')}
function next(id){const a=data(),o=a.find(x=>x.id===id);if(o){o.step=Math.min(4,(o.step||1)+1);localStorage.setItem(KEY,JSON.stringify(a));render(o)}}
function sample(){render({id:'MTG-DEMO',name:'משפחה לדוגמה',service:'משכנתא חדשה',step:2})}
const q=new URLSearchParams(location.search),id=q.get('lead');if(id){leadInput.value=id;const o=data().find(x=>x.id===id);if(o)render(o)}
</script></body></html>
